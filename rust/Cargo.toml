[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
# Exact versions: a receipt signature depends on these crates' behaviour, so a
# silent minor bump must not change a byte. Why each is here:
# - hmac and sha2 compute the HMAC-SHA256 that signs a receipt, and hmac's
#   verify_slice is the constant-time comparison.
# - serde and serde_json read a receipt into an ordered map and into typed
#   fields (deny_unknown_fields). preserve_order keeps the key order of the
#   file, which the signature covers. arbitrary_precision keeps a number's text,
#   so an integer larger than 64 bits writes back as Python writes it.
hmac = "=0.12.1"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order", "arbitrary_precision"] }
# signal-hook installs a signal handler through a safe API, so mx-repo can remove its scratch
# clone on SIGINT, SIGTERM and SIGHUP the way bash's EXIT trap does while this workspace
# keeps `unsafe_code = "forbid"`. Its handlers reset to the default action in every child.
signal-hook = "=0.3.18"
# rustix makes descriptor 9 inheritable: a Rust `File` is opened close-on-exec, so mx-run
# duplicates the lock file onto a descriptor numbered 9 with the safe `dup2`, which leaves
# the copy without the flag. Only its `io` module is used; the `std` feature is the default.
rustix = { version = "=1.1.6", default-features = false, features = ["std"] }
mx-core = { path = "crates/mx-core" }
mx-ports = { path = "crates/mx-ports" }
mx-profile = { path = "crates/mx-profile" }
mx-backends = { path = "crates/mx-backends" }
mx-receipt = { path = "crates/mx-receipt" }
mx-suite = { path = "crates/mx-suite" }
mx-sandbox = { path = "crates/mx-sandbox" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Only mx-ports may start a process. clippy.toml lists the banned call, and
# this level makes a plain `cargo clippy` refuse it without `-D warnings`.
disallowed_methods = "deny"

# Allowed, with the reason for each:
# - missing_errors_doc: every `Result` here returns a named error enum whose
#   variants are documented where they are defined, and the method docs say what
#   each state means. A repeated `# Errors` section adds noise and no fact.
missing_errors_doc = "allow"
