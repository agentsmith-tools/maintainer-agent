[package]
name = "mx-gate"
version = "0.1.0"
description = "The merge gate as types: the pull request typestate, the gh-facing facts and port, every refusal of merge with its exact text, and the verify-deps types"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mx_gate"
path = "src/lib.rs"

[[bin]]
name = "maintainer-merge"
path = "src/main.rs"

[dependencies]
mx-core.workspace = true
mx-profile.workspace = true
mx-ports.workspace = true
mx-receipt.workspace = true
mx-sandbox.workspace = true
mx-suite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# The end-to-end test that runs the verify in a real container, with the real podman and an image
# already on the machine. Off by default: the gate refuses an ignored test, and a test that skips
# itself reads as green. Run it with
#   cargo test -p mx-gate --features podman-e2e --test verify_end_to_end
podman-e2e = []

[lints]
workspace = true
